name: smart_pot
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0


dependencies:
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  bloc_test: ^10.0.0
  equatable: ^2.0.7
  freezed: ^3.0.6
  freezed_annotation: ^3.0.0
  flex_color_scheme: ^8.1.1
  flutter_bloc: ^9.1.1
  google_fonts: ^6.2.1
  get_it: ^8.0.3
  hydrated_bloc: ^10.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  intl_utils: ^2.8.10
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: false
  image_path: assets/images/icon.png
  adaptive_icon_background: "#E8F5E9"
  adaptive_icon_foreground: assets/images/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
flutter_intl:
  enabled: true
  arb_dir: lib/application/l10n
  output_dir: lib/application/generated
